<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOODTECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #070707;
            --card: rgba(10, 9, 6, 0.92);
            --gold-1: #FFE9A0;
            --gold-2: #F5C542;
            --gold-3: #B8860B;
            --text: #FFF8E1;
            --text-soft: #C9B779;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background: var(--black);
        }

        /* Fond anime : noir + lueurs dorees qui bougent */
        body::before {
            content: '';
            position: fixed;
            inset: -20%;
            z-index: -2;
            background:
                radial-gradient(circle at 15% 8%, rgba(245, 197, 66, 0.16), transparent 32%),
                radial-gradient(circle at 92% 55%, rgba(184, 134, 11, 0.13), transparent 30%),
                radial-gradient(circle at 25% 98%, rgba(255, 233, 160, 0.10), transparent 30%),
                linear-gradient(160deg, #000 0%, #0b0905 50%, #000 100%);
            animation: drift 14s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-3%, 2%) scale(1.08); }
            100% { transform: translate(3%, -2%) scale(1.04); }
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
            padding-bottom: 40px;
        }

        /* ---------- GOODTECH ---------- */
        .header { text-align: center; margin-top: 32px; }


        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .avatar {
            width: 84px;
            height: 84px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
            border: 3px solid var(--gold-2);
            box-shadow: 0 0 18px rgba(245, 197, 66, 0.45);
        }

        .brand {
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 900;
            font-size: clamp(1.5rem, 7.5vw, 2.5rem);
            letter-spacing: 0.08em;
            background: linear-gradient(100deg, var(--gold-3) 0%, var(--gold-1) 30%, var(--gold-2) 50%, var(--gold-1) 70%, var(--gold-3) 100%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(245, 197, 66, 0.45));
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 250% center; } }

        .brand-line {
            width: 90px;
            height: 3px;
            margin: 10px auto 12px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
        }

        .bio-text { color: var(--text-soft); font-size: 1rem; }

        /* ---------- Boutons ---------- */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            padding: 17px 24px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            border: 1px solid rgba(245, 197, 66, 0.28);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .link-btn:hover,
        .link-btn:focus-visible {
            transform: translateY(-3px);
            border-color: var(--gold-2);
            box-shadow: 0 8px 22px rgba(245, 197, 66, 0.28);
            outline: none;
        }

        .icon { width: 28px; height: 28px; flex-shrink: 0; }

        /* ---------- Photo ---------- */
        .photo-section { width: 100%; display: flex; justify-content: center; padding-top: 14px; }

        .photo-card {
            padding: 3px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--gold-1), var(--gold-3), var(--gold-2));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(245, 197, 66, 0.25);
        }

        .featured-photo {
            max-width: 350px;
            width: 100%;
            height: auto;
            border-radius: 23px;
            display: block;
            object-fit: cover;
            background: #111;
        }


        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            background: #14100a;
            color: var(--gold-1);
            border: 1px solid var(--gold-2);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 400px) {
            .link-btn { font-size: 1.02rem; padding: 15px 18px; }
            .avatar { width: 68px; height: 68px; }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before, .brand { animation: none; }
        }
    </style>
</head>
